<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Vibe City — vehicle showroom</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; font-family: system-ui, sans-serif; }
  #ui { position: fixed; top: 10px; left: 10px; color: #fff; font-size: 12px; background: rgba(0,0,0,.55); padding: 8px 10px; border-radius: 6px; z-index: 2; }
  #ui button { margin: 2px; }
  #fps { position: fixed; top: 10px; right: 10px; color: #0f0; font: 12px monospace; background: rgba(0,0,0,.5); padding: 4px 8px; z-index: 2; }
</style>
</head>
<body>
<div id="ui">
  <div><b>Vehicle showroom</b> — drag to orbit</div>
  <button id="night">Day / Night</button><button id="siren">Siren</button><button id="brake">Brake</button><button id="ind">Indicators</button><button id="hired">Taxi hired</button><button id="traffic">Traffic x200</button><button id="rotor">Rotors</button>
  <div id="info"></div>
</div>
<div id="fps"></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { createVehicleModel, TrafficRenderer, VEHICLE_SPECS, pickTrafficType, getTypeAssets } from '/src/entities/vehicles/index.js';

const q = new URLSearchParams(location.search);
if (q.has('clean')) document.head.insertAdjacentHTML('beforeend', '<style>#ui,#fps{display:none}</style>');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.info.autoReset = false;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
// simple outdoor environment: sky gradient dome + sun glow + ground
function makeSkyEnv() {
  const s = new THREE.Scene();
  const g = new THREE.SphereGeometry(50, 32, 16);
  const m = new THREE.ShaderMaterial({ side: THREE.BackSide, uniforms: {}, vertexShader: 'varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }',
    fragmentShader: `varying vec3 vP; void main(){ float h = vP.y; vec3 sky = mix(vec3(0.75,0.82,0.9), vec3(0.25,0.45,0.85), smoothstep(0.0,0.6,h)); vec3 gr = mix(vec3(0.32,0.31,0.3), vec3(0.18,0.18,0.17), smoothstep(0.0,-0.5,h)); vec3 c = h > 0.0 ? sky : gr; vec3 sd = normalize(vec3(0.5,0.75,0.35)); c += vec3(2.5,2.3,2.0) * pow(max(dot(vP, sd),0.0), 300.0) + vec3(0.4,0.35,0.3)*pow(max(dot(vP,sd),0.0),8.0); gl_FragColor = vec4(c,1.); }` });
  s.add(new THREE.Mesh(g, m));
  return s;
}
const envDay = pmrem.fromScene(makeSkyEnv(), 0).texture;
scene.environmentIntensity = 0.7;
scene.environment = envDay;
const dayBg = new THREE.Color(0x9fb8cf), nightBg = new THREE.Color(0x05070c);
scene.background = dayBg.clone();
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 2000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

const sun = new THREE.DirectionalLight(0xfff2dd, 2.2);
sun.position.set(12, 20, 8); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -40, right: 40, top: 40, bottom: -40, near: 1, far: 80 });
sun.shadow.bias = -0.0004;
scene.add(sun);
const hemi = new THREE.HemisphereLight(0xcfe3ff, 0x3a3530, 0.6); scene.add(hemi);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshStandardMaterial({ color: 0x5d6064, roughness: 0.42, metalness: 0.0 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const grid = new THREE.GridHelper(400, 100, 0x444444, 0x444444); grid.position.y = 0.002; grid.material.opacity = 0.25; grid.material.transparent = true; scene.add(grid);

const types = q.get('types') ? q.get('types').split(',') : Object.keys(VEHICLE_SPECS);
const models = [];
// rows: road cars at z=0, boats floating on water at z=+22, aircraft at z=-22
const rowX = { car: 0, boat: 0, air: 0 }, rowZ = { car: 0, boat: 22, air: -22 };
const t0 = performance.now();
for (const type of types) {
  const s = VEHICLE_SPECS[type];
  const row = !s.kind ? 'car' : s.kind === 'boat' ? 'boat' : 'air';
  const m = createVehicleModel(type, { seed: models.length });
  const half = Math.max(s.width, s.rotorDiameter ? s.rotorDiameter * 0.6 : 0) / 2;
  rowX[row] += half + 1.6;
  m.root.position.set(rowX[row], row === 'air' ? +(q.get('alt') || 0) : 0, rowZ[row]);
  m.root.rotation.y = q.has('yaw') ? +q.get('yaw') : Math.PI * 0.18;
  rowX[row] += half + 1.6;
  m.rotorSpeed = +(q.get('rotor') || 0);
  scene.add(m.root);
  models.push(m);
}
const x = Math.max(rowX.car, rowX.boat, rowX.air);
if (rowX.boat > 0) {
  const water = new THREE.Mesh(new THREE.PlaneGeometry(rowX.boat + 30, 26), new THREE.MeshPhysicalMaterial({ color: 0x0d3a44, roughness: 0.06, metalness: 0.0, transparent: true, opacity: 0.88, clearcoat: 1 }));
  water.rotation.x = -Math.PI / 2; water.position.set(rowX.boat / 2, 0.0, rowZ.boat); water.receiveShadow = true; water.renderOrder = 1;
  scene.add(water);
  // dig the showroom floor away under the water so hulls are visible below the waterline
  if (!rowX.car && !rowX.air) { ground.position.y = -2.5; grid.position.y = -2.49; } else water.position.y = 0.01;
}
const buildMs = performance.now() - t0;
let tris = 0;
for (const m of models) m.root.traverse(o => { if (o.isMesh && o.geometry.index) tris += o.geometry.index.count / 3; });
document.getElementById('info').textContent = `${models.length} hero vehicles, build ${buildMs.toFixed(0)} ms, ${(tris / 1000).toFixed(1)}k tris`;
if (q.has('stats')) {
  // ?stats: per-type triangle counts (body+glass geometry, wheels excluded) for both LODs
  const rows = Object.keys(VEHICLE_SPECS).map(t => {
    const r = ['high', 'low'].map(lod => { const A = getTypeAssets(t, lod); return Math.round(A.geometry.index.count / 3 + (A.glassGeo ? A.glassGeo.index.count / 3 : 0)); });
    return `${t.padEnd(12)} high ${r[0]}  low ${r[1]}`;
  });
  console.log(rows.join('\n'));
  document.getElementById('info').insertAdjacentHTML('beforeend', '<pre>' + rows.join('\n') + '</pre>');
}

// focus camera
const focus = q.get('type');
const fm = focus ? models[types.indexOf(focus)] : null;
const cx = fm ? fm.root.position.x : x / 2;
const cz = fm ? fm.root.position.z : 0;
const view = q.get('cam') || 'three';
const dist = fm ? Math.max(fm.spec.length, fm.spec.rotorDiameter || 0) * 1.25 + 1.2 : x * 0.55;
const views = {
  three: [cx + dist * 0.75, dist * 0.32, dist * 0.8],
  front: [cx - dist * 0.55, dist * 0.2, -dist * 0.9],
  frontc: [cx + 0.01, dist * 0.12, -dist * 1.0],
  rear: [cx + dist * 0.55, dist * 0.22, dist * 0.95],
  side: [cx + dist * 1.0, dist * 0.12, dist * 0.18],
  top: [cx + 0.1, dist * 1.4, 0.1],
  low: [cx + dist * 0.8, 0.5, -dist * 0.6],
};
camera.position.set(...views[view]); camera.position.z += cz; if (fm) camera.position.y += fm.root.position.y;
controls.target.set(cx, fm ? fm.root.position.y + fm.spec.height * 0.45 : 0.8, cz);
controls.update();

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.35, 0.35, 1.6);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// state
let night = q.has('night'), siren = q.has('siren'), brake = q.has('brake'), ind = false, hired = false;
function applyLights() {
  for (const m of models) m.setLights({ head: night, brake, siren, indicatorL: ind, indicatorR: ind, taxiSign: hired ? 'hired' : 'free', spot: siren });
  scene.environment = envDay;
  scene.environmentIntensity = night ? 0.05 : 0.7;
  scene.background.copy(night ? nightBg : dayBg);
  sun.intensity = night ? 0.05 : 2.2;
  hemi.intensity = night ? 0.05 : 0.6;
  ground.material.color.set(night ? 0x2a2c30 : 0x5d6064);
  if (traffic) traffic.nightness = night;
}
document.getElementById('rotor').onclick = () => { for (const m of models) m.rotorSpeed = m.rotorSpeed ? 0 : 38; };
document.getElementById('night').onclick = () => { night = !night; applyLights(); };
document.getElementById('siren').onclick = () => { siren = !siren; applyLights(); };
document.getElementById('brake').onclick = () => { brake = !brake; applyLights(); };
document.getElementById('ind').onclick = () => { ind = !ind; applyLights(); };
document.getElementById('hired').onclick = () => { hired = !hired; applyLights(); };

// traffic stress test
let traffic = null, cars = [];
function startTraffic() {
  if (traffic) return;
  traffic = new TrafficRenderer(scene, { maxPerType: 64 });
  for (let i = 0; i < 200; i++) {
    const type = pickTrafficType();
    const ring = 30 + (i % 8) * 6;
    cars.push({ id: traffic.add(type), type, ring, a: Math.random() * Math.PI * 2, v: 6 + Math.random() * 8, dir: i % 2 ? 1 : -1, spin: 0 });
  }
  camera.position.set(0, 70, 90); controls.target.set(0, 0, 0);
  if (q.get('tcam') === 'close') { camera.position.set(44, 2.2, 6); controls.target.set(36, 0.8, 18); }
}
document.getElementById('traffic').onclick = startTraffic;
if (q.has('traffic')) startTraffic();
applyLights();

const pos = new THREE.Vector3(), quat = new THREE.Quaternion(), up = new THREE.Vector3(0, 1, 0);
let last = performance.now(), frames = 0, acc = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  controls.update();
  for (const m of models) { m.setWheelState(q.has('spin') ? dt * 8 : 0, Math.sin(now / 900) * 0.35); m.update(dt); }
  if (traffic) {
    for (const c of cars) {
      c.a += c.dir * c.v * dt / c.ring;
      pos.set(Math.cos(c.a) * c.ring, 0, Math.sin(c.a) * c.ring);
      // heading: tangent of circle; forward is -z in model space
      const heading = Math.atan2(-Math.sin(c.a) * c.dir, Math.cos(c.a) * c.dir);
      quat.setFromAxisAngle(up, -heading + Math.PI);
      c.spin -= c.v * dt / 0.33;
      traffic.setTransform(c.id, pos, quat, c.spin, 0.12 * c.dir, { head: night, brake: (Math.sin(now / 700 + c.ring) > 0.7), siren: c.type === 'police' });
    }
    traffic.update(dt);
  }
  renderer.info.reset();
  composer.render();
  frames++; acc += dt;
  if (acc > 0.5) { document.getElementById('fps').textContent = `${(frames / acc).toFixed(0)} fps · calls ${renderer.info.render.calls} · tris ${(renderer.info.render.triangles / 1000).toFixed(0)}k`; frames = 0; acc = 0; }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__ready = true;
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight); });
</script>
</body>
</html>
